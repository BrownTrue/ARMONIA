<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Revisore fonologico ARMONIA</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#20302b;background:#f5f7f5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.muted{color:#687873}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.stat,.panel{background:#fff;border:1px solid #dce5e0;border-radius:18px;padding:16px}.stat b{display:block;font-size:24px;margin-top:5px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tools input,.tools select,.field input,.field textarea{border:1px solid #cdd9d3;border-radius:10px;padding:10px;background:#fff}.tools input{flex:1;min-width:220px}.layout{display:grid;grid-template-columns:minmax(270px,.8fr) minmax(0,1.6fr);gap:18px}.image{width:100%;max-height:440px;object-fit:contain;background:#fafbfa;border-radius:14px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef5ef;font-size:12px;font-weight:700}.data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.data div{background:#f7f9f8;border-radius:12px;padding:12px}.data small,.field label{display:block;color:#71807b;font-weight:700;margin-bottom:5px}.actions,.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button,.nav button{border:0;border-radius:11px;padding:11px 15px;font-weight:700}.primary{background:#376d59;color:#fff}.secondary{background:#eef3f0}.defer{background:#fff4d8}.editor{display:none;margin-top:18px;border-top:1px solid #dde5e1;padding-top:18px}.editor.open{display:block}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field textarea,.field input{width:100%}.field.wide{grid-column:1/-1}.error{white-space:pre-wrap;color:#a73522;background:#fff0ec;border-radius:10px;padding:10px;margin-top:10px;display:none}.decision{margin-top:12px;font-weight:700}.empty{padding:40px;text-align:center}.kbd{font-family:monospace;background:#e9eeeb;border-radius:5px;padding:2px 5px}@media(max-width:760px){.shell{padding:14px}.top{display:block}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.fields,.data{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="shell">
  <div class="top"><div><h1>Revisore fonologico ARMONIA</h1><p class="muted">Tool locale: le decisioni non modificano <code>phonology.ts</code>.</p></div><p class="muted"><span class="kbd">A</span> approva · <span class="kbd">D</span> rivedi dopo</p></div>
  <div id="stats" class="stats"></div>
  <div class="tools"><input id="search" type="search" placeholder="Cerca lemma o ID"><select id="filter"><option value="all">Tutti</option><option value="pending">Da revisionare</option><option value="linear">Lineari</option><option value="attention">Da controllare</option><option value="approved">Approvati</option><option value="corrected">Corretti</option><option value="deferred">Rivedi dopo</option></select></div>
  <div id="root"></div>
</main>
<script>
let state={items:[],summary:{}},visible=[],index=0,editing=false;
const root=document.querySelector('#root'),stats=document.querySelector('#stats'),search=document.querySelector('#search'),filter=document.querySelector('#filter');
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const pretty=value=>JSON.stringify(value??[],null,2);
const metadata=candidate=>({syllabification:candidate.syllabification,syllableCount:candidate.syllableCount,phonemicTranscription:candidate.phonemicTranscription,phonemes:candidate.phonemes||[],consonantClusters:candidate.consonantClusters||[],geminates:candidate.geminates||[],pronunciationNotes:candidate.pronunciationNotes||''});

async function load(preferred){const response=await fetch('/api/state');state=await response.json();apply(preferred)}
function apply(preferred){const query=search.value.trim().toLowerCase(),mode=filter.value;visible=state.items.filter(item=>{const status=item.decision?.status;return(!query||(item.asset.label+' '+item.asset.id).toLowerCase().includes(query))&&(mode==='all'||(mode==='pending'&&!status)||(mode==='linear'&&item.classification==='linear')||(mode==='attention'&&item.classification==='attention')||status===mode)});const found=preferred?visible.findIndex(item=>item.asset.id===preferred):-1;index=found>=0?found:Math.min(index,Math.max(visible.length-1,0));render()}
function renderStats(){const s=state.summary;stats.innerHTML=[['Totale',s.total],['Approvati',s.approved],['Corretti',s.corrected],['Rimandati',s.deferred],['Da revisionare',s.pending]].map(([label,value])=>`<div class="stat"><span class="muted">${label}</span><b>${value}</b></div>`).join('')}
function render(){renderStats();editing=false;if(!visible.length){root.innerHTML='<div class="panel empty">Nessun candidato corrisponde al filtro.</div>';return}const item=visible[index],candidate=item.candidate,decision=item.decision,current=decision?.metadata||metadata(candidate),filename=item.asset.imagePath.split('/').pop();root.innerHTML=`<div class="layout"><section class="panel"><img class="image" src="/images/${encodeURIComponent(filename)}" alt="${esc(item.asset.altText)}"><h2>${esc(item.asset.label)}</h2><p class="muted">${esc(item.asset.id)}</p><p>${esc(item.asset.semanticCategory)} · ${esc(item.asset.partOfSpeech)}</p><span class="badge">${item.classification==='linear'?'Relativamente lineare':'Da controllare'}</span>${item.reason?`<p><b>Motivo:</b> ${esc(item.reason)}</p>`:''}${decision?`<p class="decision">Decisione: ${esc(decision.status)}</p>`:''}</section><section class="panel"><div class="data"><div><small>Sillabazione</small>${esc(current.syllabification)}</div><div><small>Numero sillabe</small>${esc(current.syllableCount)}</div><div><small>IPA</small>${esc(current.phonemicTranscription)}</div><div><small>Geminate</small>${esc((current.geminates||[]).map(x=>'/'+x+'/').join(', ')||'Nessuna')}</div><div><small>Fonemi</small>${esc((current.phonemes||[]).map(x=>'/'+x.symbol+'/ · '+x.position+' · sillaba '+x.syllable).join(', '))}</div><div><small>Cluster</small>${esc((current.consonantClusters||[]).map(x=>'/'+x.phonemes.join('')+'/ · '+x.position+' · sillaba '+x.syllable).join(', ')||'Nessuno')}</div></div>${current.pronunciationNotes?`<p><b>Note:</b> ${esc(current.pronunciationNotes)}</p>`:''}<div class="actions"><button class="primary" id="approve">Approva</button><button class="secondary" id="edit">Correggi</button><button class="defer" id="defer">Rivedi dopo</button></div>${editor(current)}<div class="nav"><button class="secondary" id="prev">← Precedente</button><button class="secondary" id="next">Successivo →</button><button class="primary" id="pending">Prossimo non revisionato</button></div></section></div>`;bind(item)}
function editor(value){return `<form id="editor" class="editor"><div class="fields"><div class="field"><label>Sillabazione</label><input name="syllabification" value="${esc(value.syllabification)}"></div><div class="field"><label>Numero sillabe</label><input name="syllableCount" type="number" min="1" value="${esc(value.syllableCount)}"></div><div class="field wide"><label>Trascrizione IPA</label><input name="phonemicTranscription" value="${esc(value.phonemicTranscription)}"></div><div class="field wide"><label>Fonemi (JSON)</label><textarea name="phonemes" rows="8">${esc(pretty(value.phonemes))}</textarea></div><div class="field wide"><label>Cluster consonantici (JSON)</label><textarea name="consonantClusters" rows="5">${esc(pretty(value.consonantClusters))}</textarea></div><div class="field"><label>Geminate (separate da virgola)</label><input name="geminates" value="${esc((value.geminates||[]).join(', '))}"></div><div class="field wide"><label>Note di pronuncia</label><textarea name="pronunciationNotes" rows="3">${esc(value.pronunciationNotes||'')}</textarea></div></div><div id="error" class="error"></div><div class="actions"><button class="primary" type="submit">Salva correzione</button><button class="secondary" type="button" id="cancel">Annulla</button></div></form>`}
function bind(item){document.querySelector('#approve').onclick=()=>save(item,'approved');document.querySelector('#defer').onclick=()=>save(item,'deferred');document.querySelector('#edit').onclick=()=>{editing=true;document.querySelector('#editor').classList.add('open');document.querySelector('#editor input').focus()};document.querySelector('#cancel').onclick=()=>{editing=false;document.querySelector('#editor').classList.remove('open')};document.querySelector('#prev').onclick=()=>{index=(index-1+visible.length)%visible.length;render()};document.querySelector('#next').onclick=()=>{index=(index+1)%visible.length;render()};document.querySelector('#pending').onclick=()=>{const after=visible.findIndex((x,position)=>position>index&&!x.decision),any=visible.findIndex(x=>!x.decision);const next=after>=0?after:any;if(next>=0){index=next;render()}};document.querySelector('#editor').onsubmit=event=>{event.preventDefault();const form=new FormData(event.currentTarget);try{save(item,'corrected',{syllabification:form.get('syllabification'),syllableCount:Number(form.get('syllableCount')),phonemicTranscription:form.get('phonemicTranscription'),phonemes:JSON.parse(form.get('phonemes')),consonantClusters:JSON.parse(form.get('consonantClusters')),geminates:String(form.get('geminates')).split(',').map(x=>x.trim()).filter(Boolean),pronunciationNotes:form.get('pronunciationNotes')})}catch(error){showError('JSON non valido: '+error.message)}}}
async function save(item,status,value){const response=await fetch('/api/decisions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assetId:item.asset.id,status,metadata:value})}),body=await response.json();if(!response.ok)return showError([body.error,...(body.details||[])].join('\n'));await load();const next=visible.findIndex(x=>!x.decision);if(next>=0){index=next;render()}}
function showError(message){const box=document.querySelector('#error');if(box){box.textContent=message;box.style.display='block'}else alert(message)}
search.oninput=()=>apply();filter.onchange=()=>apply();window.addEventListener('keydown',event=>{if(editing||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(event.key.toLowerCase()==='a')document.querySelector('#approve')?.click();if(event.key.toLowerCase()==='d')document.querySelector('#defer')?.click()});load();
</script>
</body>
</html>
